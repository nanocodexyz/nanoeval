name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:types
      - run: npm test
      - run: npm run dry-run
      - name: End to end, directory slots
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '3'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, oracle
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_MODEL: oracle
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, blobs in R2 through the Worker
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_STORE: r2
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '3'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, final messages and a judge
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: judge
      - name: End to end, directory slots, failure kinds and a rerun
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: failures
      - name: End to end, directory slots, a Claude plan signed in on the Worker pays
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: plan
          NANOEVAL_E2E_SLOTS: '2'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, orchestrator restart
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: restart
      - name: End to end, directory slots, the Worker killed in a turn while a cell runs on the hand
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: midturn
      - name: End to end, directory slots, the Worker killed in a turn while its model is asked
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: midturn
          NANOEVAL_E2E_KILL: model
      - name: End to end, directory slots, the Worker killed in a turn while a wait for a cell is out
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: midturn
          NANOEVAL_E2E_KILL: wait
      - name: End to end, directory slots, a session that lost the turn of its row
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: forgotten
      - name: End to end, directory slots, two attached runners
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: runners
          NANOEVAL_E2E_SLOTS: '2'
      - name: End to end, directory slots, a runner lost during the run
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: lost
          NANOEVAL_E2E_SLOTS: '2'
          NANOEVAL_E2E_LEASE_SEC: '3'
      - name: End to end, directory slots, a runner whose machine brings no slot up beside one that works
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: machine
          NANOEVAL_E2E_SLOTS: '2'
      - name: End to end, directory slots, a runner restarted during the run
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: resume
          NANOEVAL_E2E_SLOTS: '8'
      - name: End to end, directory slots, free disk floor
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: disk
      - name: End to end, directory slots, memory packing
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: packing
      - name: End to end, directory slots, a task that closes its network is refused
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: closed
      - name: End to end, directory slots, installed agents with a scripted command
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_MODEL: installed
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '3'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, installed agents, failure kinds and a rerun
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_MODEL: installed
          NANOEVAL_E2E_SCENARIO: failures
      - name: End to end, directory slots, installed agents, a runner restarted during the run
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_MODEL: installed
          NANOEVAL_E2E_SCENARIO: resume
          NANOEVAL_E2E_SLOTS: '8'
      - name: End to end, directory slots, models and the sandbox through a scripted gateway
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_GATEWAY: '1'
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '3'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, installed agents and the sandbox through a scripted gateway
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_GATEWAY: '1'
          NANOEVAL_E2E_MODEL: installed
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '3'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, a standing runner that two runs are handed to
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: standing
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '3'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, a standing runner stopped during a run and another started
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: stopped
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '6'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, a sandbox kept warm for a second run through a scripted gateway
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_GATEWAY: '1'
          NANOEVAL_E2E_SCENARIO: warm
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '3'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, two leased sandboxes of which one dies during the run
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_GATEWAY: '1'
          NANOEVAL_E2E_SCENARIO: fleet
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '1'
      - name: End to end, directory slots, a gateway that sells no renewal, so sandboxes end with their lease and are replaced
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_GATEWAY: '1'
          NANOEVAL_E2E_SCENARIO: lapse
          NANOEVAL_E2E_SANDBOX_LEASE_SEC: '6'
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '1'
          NANOEVAL_E2E_ATTEMPTS: '8'
      - name: End to end, directory slots, a runner whose sandbox ends before the rows could
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: ending
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '6'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, model requests whose payment a scripted gateway refuses in passing
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_GATEWAY: '1'
          NANOEVAL_E2E_SCENARIO: refused
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '3'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, installed agents, model requests whose payment a scripted gateway refuses in passing
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_GATEWAY: '1'
          NANOEVAL_E2E_MODEL: installed
          NANOEVAL_E2E_SCENARIO: refused
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '3'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, a key that is spent during the run
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_GATEWAY: '1'
          NANOEVAL_E2E_SCENARIO: spent
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '1'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, krun slots, skipped where krun cannot run
        run: npm run e2e
      - name: End to end, krun slots, oracle, skipped where krun cannot run
        run: npm run e2e
        env:
          NANOEVAL_E2E_MODEL: oracle
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_ATTEMPTS: '1'
          NANOEVAL_E2E_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      - name: End to end, krun slots, blobs in R2 through the Worker, skipped where krun cannot run
        run: npm run e2e
        env:
          NANOEVAL_E2E_STORE: r2
      - name: End to end, krun slots, final messages and a judge, skipped where krun cannot run
        run: npm run e2e
        env:
          NANOEVAL_E2E_SCENARIO: judge
      - name: End to end, krun slots, final messages and a judge, oracle, skipped where krun cannot run
        run: npm run e2e
        env:
          NANOEVAL_E2E_SCENARIO: judge
          NANOEVAL_E2E_MODEL: oracle
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, krun slots, failure kinds and a rerun, skipped where krun cannot run
        run: npm run e2e
        env:
          NANOEVAL_E2E_SCENARIO: failures
      - name: End to end, krun slots, orchestrator restart, skipped where krun cannot run
        run: npm run e2e
        env:
          NANOEVAL_E2E_SCENARIO: restart
      - name: End to end, krun slots, a session that lost the turn of its row, skipped where krun cannot run
        run: npm run e2e
        env:
          NANOEVAL_E2E_SCENARIO: forgotten
      - name: End to end, krun slots, slot networks, skipped where krun cannot run
        run: npm run e2e
        env:
          NANOEVAL_E2E_SCENARIO: network
      - name: End to end, krun slots, closed networks, skipped where krun cannot run
        run: npm run e2e
        env:
          NANOEVAL_E2E_SCENARIO: closed
      - name: End to end, krun slots, closed networks, installed agents, skipped where krun cannot run
        run: npm run e2e
        env:
          NANOEVAL_E2E_MODEL: installed
          NANOEVAL_E2E_SCENARIO: closed
      - name: End to end, krun slots, verifier cache, skipped where krun cannot run
        run: npm run e2e
        env:
          NANOEVAL_E2E_SCENARIO: cache
      - name: End to end, krun slots, disk removal, skipped where krun cannot run
        run: npm run e2e
        env:
          NANOEVAL_E2E_SCENARIO: disks
      - name: End to end, krun slots, free disk floor, skipped where krun cannot run
        run: npm run e2e
        env:
          NANOEVAL_E2E_SCENARIO: disk
      - name: End to end, krun slots, memory packing, skipped where krun cannot run
        run: npm run e2e
        env:
          NANOEVAL_E2E_SCENARIO: packing
      - name: End to end, krun slots, two attached runners, skipped where krun cannot run
        run: npm run e2e
        env:
          NANOEVAL_E2E_SCENARIO: runners
          NANOEVAL_E2E_SLOTS: '2'
      - name: End to end, krun slots, a runner lost during the run, skipped where krun cannot run
        run: npm run e2e
        env:
          NANOEVAL_E2E_SCENARIO: lost
          NANOEVAL_E2E_SLOTS: '2'
          NANOEVAL_E2E_LEASE_SEC: '3'
      - name: End to end, krun slots, a runner whose machine brings no slot up beside one that works, skipped where krun cannot run
        run: npm run e2e
        env:
          NANOEVAL_E2E_SCENARIO: machine
          NANOEVAL_E2E_SLOTS: '2'
      - name: End to end, krun slots, a runner restarted during the run, skipped where krun cannot run
        run: npm run e2e
        env:
          NANOEVAL_E2E_SCENARIO: resume
          NANOEVAL_E2E_SLOTS: '8'
      - name: End to end, krun slots, installed agents with a scripted command, skipped where krun cannot run
        run: npm run e2e
        env:
          NANOEVAL_E2E_MODEL: installed
      - name: End to end, krun slots, installed agents, failure kinds and a rerun, skipped where krun cannot run
        run: npm run e2e
        env:
          NANOEVAL_E2E_MODEL: installed
          NANOEVAL_E2E_SCENARIO: failures
      - name: End to end, krun slots, installed agents, a runner restarted during the run, skipped where krun cannot run
        run: npm run e2e
        env:
          NANOEVAL_E2E_MODEL: installed
          NANOEVAL_E2E_SCENARIO: resume
          NANOEVAL_E2E_SLOTS: '8'
      - name: End to end, krun slots, models and the sandbox through a scripted gateway, skipped where krun cannot run
        run: npm run e2e
        env:
          NANOEVAL_E2E_GATEWAY: '1'
      - name: End to end, krun slots, installed agents and the sandbox through a scripted gateway, skipped where krun cannot run
        run: npm run e2e
        env:
          NANOEVAL_E2E_GATEWAY: '1'
          NANOEVAL_E2E_MODEL: installed
      - name: End to end, ns slots, skipped where the test is not root and no guest can boot
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: ns
      - name: End to end, ns slots, oracle, skipped where the test is not root and no guest can boot
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: ns
          NANOEVAL_E2E_MODEL: oracle
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_ATTEMPTS: '1'
          NANOEVAL_E2E_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      - name: End to end, ns slots, failure kinds and a rerun, skipped where the test is not root and no guest can boot
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: ns
          NANOEVAL_E2E_SCENARIO: failures
      - name: End to end, ns slots, slot networks, skipped where the test is not root and no guest can boot
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: ns
          NANOEVAL_E2E_SCENARIO: network
      - name: End to end, ns slots, verifier cache, skipped where the test is not root and no guest can boot
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: ns
          NANOEVAL_E2E_SCENARIO: cache
      - name: End to end, ns slots, installed agents with a scripted command, skipped where the test is not root and no guest can boot
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: ns
          NANOEVAL_E2E_MODEL: installed
      - name: End to end, ns slots, the runner from its runtime archive, skipped where the test is not root and no guest can boot
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: ns
          NANOEVAL_E2E_MODEL: oracle
          NANOEVAL_E2E_RUNTIME: '1'
          NANOEVAL_E2E_STORE: r2
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, ns slots, models and the sandbox through a scripted gateway, skipped where the test is not root and no guest can boot
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: ns
          NANOEVAL_E2E_GATEWAY: '1'
      - name: End to end, ns slots, a leased sandbox that starts its runner from the runtime archive, skipped where the test is not root and no guest can boot
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: ns
          NANOEVAL_E2E_GATEWAY: '1'
          NANOEVAL_E2E_MODEL: oracle
          NANOEVAL_E2E_RUNTIME: '1'
          NANOEVAL_E2E_STORE: r2
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, ns slots, a leased sandbox kept warm for a second run, skipped where the test is not root and no guest can boot
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: ns
          NANOEVAL_E2E_GATEWAY: '1'
          NANOEVAL_E2E_MODEL: oracle
          NANOEVAL_E2E_RUNTIME: '1'
          NANOEVAL_E2E_SCENARIO: warm
          NANOEVAL_E2E_STORE: r2
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '1'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, ns slots, a row that asks for more memory than the machine has runs alone with what is free, skipped where the test is not root and no guest can boot
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: ns
          NANOEVAL_E2E_SCENARIO: alone
      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: |
            output/e2e/**/wrangler.log
            output/e2e/**/runner*.log
            output/e2e/**/status.json
            output/e2e/**/harbor

  krun:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: krun
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
