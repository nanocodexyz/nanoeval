name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/machine
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            krun/target
          key: launcher-${{ github.job }}-${{ hashFiles('krun/Cargo.lock', 'krun/rust-toolchain.toml') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/nanoeval/oci
          key: layers-${{ github.job }}-${{ hashFiles('tasks/*/environment/Dockerfile', 'test/fixtures/*/environment/Dockerfile', 'test/guest/Dockerfile') }}
      - run: npm ci
      - run: npm run lint
      - run: npm run check:types
      - run: npm test
      - run: npm run dry-run

  e2e-dir:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: End to end, directory slots
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '3'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, first byte late
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_FIRST_BYTE_MS: '2000'
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '3'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, oracle
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_MODEL: oracle
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, oracle, a solution that fails and the check of the sound tasks
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_MODEL: oracle
          NANOEVAL_E2E_SCENARIO: unsound
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, blobs in R2 through the Worker
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_STORE: r2
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '3'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, final messages and a judge
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: judge
      - name: End to end, directory slots, failure kinds and a rerun
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: failures
      - name: End to end, directory slots, a Claude plan signed in on the Worker pays, and compare tells its run from one the key pays for
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: plan
          NANOEVAL_E2E_SLOTS: '2'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, a Claude login file whose token ended and is then rejected, refreshed against a scripted Claude
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: login
      - name: End to end, directory slots, installed agents on login files of both tools, refreshed against scripted providers
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_MODEL: installed
          NANOEVAL_E2E_SCENARIO: login
      - name: End to end, directory slots, orchestrator restart
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: restart
      - name: End to end, directory slots, the Worker killed in a turn while a cell runs on the hand
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: midturn
      - name: End to end, directory slots, the Worker killed in a turn while its model is asked
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: midturn
          NANOEVAL_E2E_KILL: model
      - name: End to end, directory slots, the Worker killed in a turn while a wait for a cell is out
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: midturn
          NANOEVAL_E2E_KILL: wait
      - name: End to end, directory slots, the Worker killed in a turn while one of two cells of a reply still runs
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: midturn
          NANOEVAL_E2E_KILL: pair
      - name: End to end, directory slots, a run cancelled while a cell of a turn runs on the hand
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: cancelled
          NANOEVAL_E2E_TASKS: write-greeting
          NANOEVAL_E2E_SLOTS: '2'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, a session that lost the turn of its row
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: forgotten
      - name: End to end, directory slots, a codex session with direct tools beside one in Code Mode
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: direct
      - name: End to end, directory slots, an agent that branches into three sessions on forked slots and keeps the one whose self-check passed
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: branches
      - name: End to end, directory slots, a lazy agent whose trunk fails its self-check forks two branches live and keeps the one whose test passed
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: lazy
      - name: End to end, directory slots, a lazy agent whose trunk passes its self-check by a test never forks
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: lazy-pass
      - name: End to end, directory slots, an agent that takes a preflight whose facts reach its first prompt
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: preflight
      - name: End to end, directory slots, a session that starts a subagent
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: subagent
      - name: End to end, directory slots, the Worker killed while the cell of a subagent runs
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: subagent
          NANOEVAL_E2E_KILL: child
      - name: End to end, directory slots, the Worker killed after a subagent ended, in the turn that started it
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: subagent
          NANOEVAL_E2E_KILL: parent
      - name: End to end, directory slots, two attached runners
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: runners
          NANOEVAL_E2E_SLOTS: '2'
      - name: End to end, directory slots, a runner lost during the run
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: lost
          NANOEVAL_E2E_SLOTS: '2'
          NANOEVAL_E2E_LEASE_SEC: '3'
      - name: End to end, directory slots, a runner whose machine brings no slot up beside one that works
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: machine
          NANOEVAL_E2E_SLOTS: '2'
      - name: End to end, directory slots, a runner restarted during the run
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: resume
          NANOEVAL_E2E_SLOTS: '8'
      - name: End to end, directory slots, free disk floor
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: disk
      - name: End to end, directory slots, memory packing
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: packing
      - name: End to end, directory slots, a runner that is given no slot count and is pinned to two hardware threads
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: threads
      - name: End to end, directory slots, a row that declares more vCPUs than its runner has hardware threads
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: wide
      - name: End to end, directory slots, a runner that admits rows by the memory its machine uses
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: overcommit
      - name: End to end, directory slots, a run that allows every agent and every verifier less time than its tasks do
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: bounded
      - name: End to end, directory slots, a task that closes its network is refused
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: closed
      - name: End to end, directory slots, installed agents with a scripted command
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_MODEL: installed
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '3'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, fx with a scripted command over chat completions and Messages
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_MODEL: installed
          NANOEVAL_E2E_AGENT: fx
      - name: End to end, directory slots, opencode with a scripted command over chat completions and Messages
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_MODEL: installed
          NANOEVAL_E2E_AGENT: opencode
      - name: End to end, directory slots, pi with a scripted command over chat completions and Messages
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_MODEL: installed
          NANOEVAL_E2E_AGENT: pi
      - name: End to end, directory slots, installed agents, failure kinds and a rerun
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_MODEL: installed
          NANOEVAL_E2E_SCENARIO: failures
      - name: End to end, directory slots, installed agents, a runner restarted during the run
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_MODEL: installed
          NANOEVAL_E2E_SCENARIO: resume
          NANOEVAL_E2E_SLOTS: '8'
      - name: End to end, directory slots, models and the sandbox through a scripted gateway
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_GATEWAY: '1'
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '3'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, installed agents and the sandbox through a scripted gateway
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_GATEWAY: '1'
          NANOEVAL_E2E_MODEL: installed
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '3'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, a standing runner that two runs are handed to
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: standing
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '3'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, a standing runner with the rows of two runs in its slots, one of them read while it runs
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: shared
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '2'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, a standing runner stopped during a run and another started
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: stopped
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '6'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, a standing runner that a run took and handed nothing
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: taken
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '3'
          NANOEVAL_E2E_ATTEMPTS: '1'
          NANOEVAL_E2E_LEASE_SEC: '10'
      - name: End to end, directory slots, a sandbox kept warm for a second run through a scripted gateway
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_GATEWAY: '1'
          NANOEVAL_E2E_SCENARIO: warm
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '3'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, two leased sandboxes of which one dies during the run
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_GATEWAY: '1'
          NANOEVAL_E2E_SCENARIO: fleet
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '1'
      - name: End to end, directory slots, a provider that refuses sandboxes for a cap and ends one under its rows
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_GATEWAY: '1'
          NANOEVAL_E2E_SCENARIO: capped
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '1'
      - name: End to end, directory slots, a sandbox that its provider ends sooner than the gateway said, and a renewal refused for it
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_GATEWAY: '1'
          NANOEVAL_E2E_SCENARIO: sooner
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '1'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, a gateway that sells no renewal, so sandboxes end with their lease and are replaced
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_GATEWAY: '1'
          NANOEVAL_E2E_SCENARIO: lapse
          NANOEVAL_E2E_SANDBOX_LEASE_SEC: '6'
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '1'
          NANOEVAL_E2E_ATTEMPTS: '4'
      - name: End to end, directory slots, a runner whose sandbox ends before the rows could
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: ending
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '6'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, model requests whose payment a scripted gateway refuses in passing
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_GATEWAY: '1'
          NANOEVAL_E2E_SCENARIO: refused
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '3'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, installed agents, model requests whose payment a scripted gateway refuses in passing
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_GATEWAY: '1'
          NANOEVAL_E2E_MODEL: installed
          NANOEVAL_E2E_SCENARIO: refused
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '3'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, a key that is spent during the run
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_GATEWAY: '1'
          NANOEVAL_E2E_SCENARIO: spent
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '1'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, a key that is refused for a while and its top-up set
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_GATEWAY: '1'
          NANOEVAL_E2E_SCENARIO: funded
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '1'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, a model budget that twelve rows running at once reach
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: budget
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '12'
          NANOEVAL_E2E_ATTEMPTS: '4'
      - name: End to end, directory slots, a model budget that rows running two at a time reach
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: budget
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '2'
          NANOEVAL_E2E_ATTEMPTS: '4'
      - name: End to end, directory slots, web searches at the list price of their provider, which spend the model budget
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: searches
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '1'
          NANOEVAL_E2E_ATTEMPTS: '2'
      - name: End to end, directory slots, responses without a cost priced at the list price of their model, which spend the model budget
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: priced
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '1'
          NANOEVAL_E2E_ATTEMPTS: '2'
      - name: End to end, directory slots, installed agents whose model endpoint answers 530 once
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_MODEL: installed
          NANOEVAL_E2E_SCENARIO: unreached
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '3'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, installed agents whose model provider answers 429 twice, once with Retry-After
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_MODEL: installed
          NANOEVAL_E2E_SCENARIO: limited
          NANOEVAL_E2E_TASKS: extract-todos,uppercase-message,write-greeting
          NANOEVAL_E2E_SLOTS: '3'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, installed agents whose time ends while the run asks a provider again that limited them
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_MODEL: installed
          NANOEVAL_E2E_SCENARIO: outlasted
          NANOEVAL_E2E_TASKS: extract-todos,write-greeting
          NANOEVAL_E2E_SLOTS: '1'
          NANOEVAL_E2E_ATTEMPTS: '1'
      - name: End to end, directory slots, sessions of two models each sent at the pace of its provider, which answers one request a window
        run: npm run e2e
        env:
          NANOEVAL_E2E_BACKEND: dir
          NANOEVAL_E2E_SCENARIO: pace
