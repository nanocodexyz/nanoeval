[workspace]
members = ["guest", "host", "nanovm", "net", "wire"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nanocodexyz/nanoeval"
publish = false

[workspace.dependencies]
flate2 = "1.1.9"
krun = { package = "libkrun", git = "https://github.com/nanocodexyz/libkrun", rev = "8ce363eb9a7080423ecf5f018a28b65a917c2d6a", features = ["blk", "net"] }
libloading = "0.8"
nanovm = { path = "nanovm" }
net = { package = "nanoeval-net", path = "net" }
nix = { version = "0.30.1", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tar = { version = "0.4.44", default-features = false, features = ["xattr"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls-no-provider"] }
wire = { path = "wire" }
xattr = "1.6.1"
zstd = { version = "0.13.3", features = ["zstdmt"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
codegen-units = 16
debug = "none"
lto = "thin"
opt-level = 3
strip = "symbols"
