[workspace]
members = ["guest", "host", "nanovm", "wire"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nanocodexyz/nanoeval"
publish = false

[workspace.dependencies]
krun = { package = "libkrun", git = "https://github.com/containers/libkrun", rev = "df85b8b75f55e8ef1b06b5bc18f08dc6d7b5aeb0", features = ["blk"] }
libloading = "0.8"
nanovm = { path = "nanovm" }
nix = { version = "0.30.1", default-features = false }
tar = { version = "0.4.44", default-features = false, features = ["xattr"] }
wire = { path = "wire" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
codegen-units = 16
debug = "none"
lto = "thin"
opt-level = 3
strip = "symbols"
